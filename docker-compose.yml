version: '3'

services:
  express-app:
    build: .
    container_name: express-app
    ports:
      - "8080:3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - express-app

networks:
  app-network:
    driver: bridge
